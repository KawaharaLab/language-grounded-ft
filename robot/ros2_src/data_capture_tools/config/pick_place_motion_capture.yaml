data_capture_manager:
  ros__parameters:
    convert_after_record: false
    rosbag_sigint_timeout_sec: 60.0
    rosbag_sigterm_timeout_sec: 10.0
    rosbag_sigkill_on_timeout: false

    # Pick pose measured with gamepad teleoperation on 2026-08-27. firm_simple
    # returns to the same XY location, so this is both the grasp and place pose.
    # Values follow home_joint_names, not the incoming /joint_states order.
    home_joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    home_positions_rad:
      - 0.7716773748397827
      - -1.5739739576922815
      - 1.733853816986084
      - -1.7504084745990198
      - -1.5834692160235804
      - -0.01414662996401006

    joint_state_topic: /joint_states
    robot_program_running_topic: /io_and_status_controller/robot_program_running
    joint_command_topic: /servo_node/delta_joint_cmds
    twist_command_topic: /servo_node/delta_twist_cmds
    servo_start_service: /servo_node/start_servo
    command_frame: base_link
    startup_timeout_sec: 30.0
    home_timeout_sec: 30.0
    # Normalization capture does not require milliradian-level repeatability.
    # A wider deadband also avoids oscillating around the target because the
    # smallest configured joint command is 0.02 rad/s.
    home_deadband: 0.01
    home_settle_duration_sec: 0.2
    home_velocity_tolerance_rad_sec: 0.01
    home_min_joint_speed: 0.02
    home_max_joint_speed: 1.0
    home_velocity_gain: 1.5

    # Keep the existing real-robot gripper parameters unchanged.
    gripper_action_name: /robotiq_2f_gripper_action
    gripper_goal_log_topic: /robotiq_2f_gripper_action_goal
    gripper_open_position: 0.140
    gripper_close_position: 0.002
    gripper_target_speed: 0.1
    gripper_target_force: 0.1
    gripper_result_timeout_sec: 25.0

    # firm_simple correspondence at Genesis dt=0.01 s:
    # hold=100 steps (1.0 s), final same-XY hover=z+0.12 m (4.0 s at
    # +0.03 m/s), hold=80 steps (0.8 s), then descend and press/release.
    control_period_sec: 0.01
    lower_twist_command_z: -0.5
    return_twist_command_z: 1.0
    post_grasp_hold_sec: 1.0
    pick_lift_duration_sec: 4.0
    post_lift_hold_sec: 0.8
    enter_extra_lower_sec: 0.5
    enter_event_alias: floor_contact
    success_reason: firm_simple_pick_place_floor_contact_then_half_second_press_and_release
    # A 0.12 m lift takes about 8.0 s to reverse at the unchanged descent
    # speed. The extra second covers the required 0.5 s post-contact press.
    max_lower_duration_sec: 9.0
    # rosbag2 DDS discovery took as long as about 3.3 s in the first 12
    # episodes. Wait before closing so future bags include the full grasp.
    post_start_recording_delay_sec: 4.0

    left_ft_topic: /force_torque/left
    right_ft_topic: /force_torque/right
    camera_wrist_topic: /camera_wrist/realsense2_camera/color/image_raw
    camera_fixed_topic: /camera_fixed/realsense2_camera/color/image_raw
    require_force_sensors: true
    require_cameras: true
    key_event_topic: /data_capture/key_events
    event_force_wait_sec: 0.03

    relay_servo_commands: true
    servo_output_topic: /forward_position_controller/commands_teleop
    robot_command_topic: /forward_position_controller/commands
